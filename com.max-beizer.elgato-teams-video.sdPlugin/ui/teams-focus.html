<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Teams Focus</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: white;
      background-color: #2D2D2D;
      margin: 0;
      padding: 16px;
      font-size: 14px;
    }

    h1 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 16px;
    }

    p {
      margin-bottom: 16px;
    }

    .description {
      background-color: #3A3A3A;
      border-radius: 4px;
      padding: 12px;
    }

    .note {
      font-style: italic;
      font-size: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>Teams Focus</h1>

  <div class="description">
    <p>
      This action brings Microsoft Teams to the foreground.
    </p>
    <p>
      It's useful when you need to quickly interact with the Teams interface
      or access controls that aren't available via keyboard shortcuts.
    </p>
    <p class="note">
      Note: If Teams is not running, the button will display "No Teams".
    </p>
  </div>
</body>
</html>
